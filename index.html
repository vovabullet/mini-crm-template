<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
  <title>Mini CRM - Заказы</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- List View -->
  <div id="list-view" class="view">
    <header class="app-header">
      <h1>Мои заказы</h1>
      <div class="filter-chips">
        <button class="filter-chip active" data-filter="all">Все</button>
        <button class="filter-chip" data-filter="new">Новые</button>
        <button class="filter-chip" data-filter="in-progress">В работе</button>
        <button class="filter-chip" data-filter="completed">Завершённые</button>
      </div>
    </header>

    <main class="order-list-container">
      <div id="order-list" class="order-list">
        <!-- Order cards will be rendered here -->
      </div>
    </main>
  </div>

  <!-- Detail View -->
  <div id="detail-view" class="view" hidden>
    <div id="detail-content">
      <!-- Detail content will be rendered here -->
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
